###############################################################################
# SerilogDemo Docker Compose
#
# Usage:
#   Default mode:  docker compose up -d
#   Scale API:     docker compose up -d --scale api=3
#   With k6 test:  docker compose --profile loadtest up -d --scale api=5
#
# Access:
#   - API:              http://localhost:8080 (via Nginx)
#   - Grafana:          http://localhost:3001 (admin/admin)
#   - Loki:             http://localhost:3100
###############################################################################

services:
  #---------------------------------------------------------------------------
  # Core Infrastructure
  #---------------------------------------------------------------------------
  
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    user: "0"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki-data:/loki
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - serilog-network

  tempo:
    image: grafana/tempo:2.10.1
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - serilog-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
      - "8888:8888"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
    networks:
      - serilog-network

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    networks:
      - serilog-network

  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - serilog-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=serilog
      - POSTGRES_PASSWORD=serilog123
      - POSTGRES_DB=ecommerce
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serilog -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serilog-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - serilog-network

  #---------------------------------------------------------------------------
  # API Service (load-balanced by Nginx)
  #---------------------------------------------------------------------------

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=ecommerce;Username=serilog;Password=serilog123
      - PaymentGateway__BaseUrl=http://payment-gateway:8080
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__VirtualHost=/
      - OTEL_SERVICE_NAME=serilogdemo-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=Development,service.namespace=serilogdemo
    depends_on:
      postgres:
        condition: service_healthy
      payment-gateway:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - serilog-network
    expose:
      - "8080"

  payment-gateway:
    build:
      context: .
      dockerfile: PaymentGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=ecommerce;Username=serilog;Password=serilog123
      - OTEL_SERVICE_NAME=payment-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=Development,service.namespace=serilogdemo
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - serilog-network
    expose:
      - "8080"

  notifications-api:
    build:
      context: .
      dockerfile: NotificationsApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=ecommerce;Username=serilog;Password=serilog123
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__VirtualHost=/
      - OTEL_SERVICE_NAME=notifications-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=Development,service.namespace=serilogdemo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - serilog-network
    expose:
      - "8080"

  fulfillment-api:
    build:
      context: .
      dockerfile: FulfillmentApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=ecommerce;Username=serilog;Password=serilog123
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - RabbitMq__VirtualHost=/
      - Fulfillment__WarehouseName=${FULFILLMENT_WAREHOUSE_NAME:-demo-warehouse-01}
      - Fulfillment__ConsumerPrefetchCount=${FULFILLMENT_CONSUMER_PREFETCH_COUNT:-16}
      - Fulfillment__OutboxBatchSize=${FULFILLMENT_OUTBOX_BATCH_SIZE:-50}
      - OTEL_SERVICE_NAME=fulfillment-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=Development,service.namespace=serilogdemo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - serilog-network
    expose:
      - "8080"

  #---------------------------------------------------------------------------
  # Load Balancer
  #---------------------------------------------------------------------------

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - fulfillment-api
    networks:
      - serilog-network

  #---------------------------------------------------------------------------
  # Load Testing (loadtest profile only)
  #---------------------------------------------------------------------------
  
  k6-ecommerce:
    image: grafana/k6:1.6.1
    container_name: k6-loadtest-ecommerce
    volumes:
      - ./k6:/scripts
    environment:
      - K6_OUT=experimental-prometheus-rw
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    command: run /scripts/load-test.js
    depends_on:
      - nginx
    networks:
      - serilog-network
    profiles:
      - loadtest

  k6-warehouse:
    image: grafana/k6:1.6.1
    container_name: k6-loadtest-warehouse
    volumes:
      - ./k6:/scripts
    environment:
      - FULFILLMENT_URL=http://fulfillment-api:8080
      - K6_OUT=experimental-prometheus-rw
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    command: run /scripts/load-test-warehouse.js
    depends_on:
      - fulfillment-api
    networks:
      - serilog-network
    profiles:
      - loadtest

  k6-restock:
    image: grafana/k6:1.6.1
    container_name: k6-loadtest-restock
    volumes:
      - ./k6:/scripts
    environment:
      - API_URL=http://nginx:80
      - K6_OUT=experimental-prometheus-rw
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - RESTOCK_LOW_WATER_MARK=${RESTOCK_LOW_WATER_MARK:-6}
      - RESTOCK_TARGET_AVAILABLE_QUANTITY=${RESTOCK_TARGET_AVAILABLE_QUANTITY:-18}
      - RESTOCK_MAX_ITEMS_PER_CYCLE=${RESTOCK_MAX_ITEMS_PER_CYCLE:-3}
      - RESTOCK_POLL_SECONDS=${RESTOCK_POLL_SECONDS:-8}
      - RESTOCK_CATEGORY_FILTER=${RESTOCK_CATEGORY_FILTER:-}
    command: run /scripts/load-test-restock.js
    depends_on:
      - nginx
    networks:
      - serilog-network
    profiles:
      - loadtest

networks:
  serilog-network:
    driver: bridge

volumes:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  postgres-data:
