###############################################################################
# SerilogDemo Docker Compose
#
# Usage:
#   Simple mode:   docker compose up -d
#   Scaled mode:   docker compose --profile scaled up -d --scale api=3
#   With k6 test:  docker compose --profile scaled --profile loadtest up -d --scale api=5
#
# Access:
#   - API (simple):     http://localhost:5299
#   - API (scaled):     http://localhost:8080 (via Nginx)
#   - Grafana:          http://localhost:3000 (admin/admin)
#   - Loki:             http://localhost:3100
###############################################################################

services:
  #---------------------------------------------------------------------------
  # Core Infrastructure
  #---------------------------------------------------------------------------
  
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    user: "0"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - serilog-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - loki
    networks:
      - serilog-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=serilog
      - POSTGRES_PASSWORD=serilog123
      - POSTGRES_DB=ecommerce
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serilog -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serilog-network

  #---------------------------------------------------------------------------
  # API Service (scalable)
  #---------------------------------------------------------------------------
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=ecommerce;Username=serilog;Password=serilog123
      - Serilog__WriteTo__LokiSink__Args__uri=http://loki:3100
      - INSTANCE_ID=api-simple
    volumes:
      - logs-data:/app/Logs
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - serilog-network
    # In simple mode, expose directly. In scaled mode, Nginx handles routing.
    ports:
      - "5299:8080"
    profiles:
      - simple

  # Scalable API (no direct port mapping - accessed via Nginx)
  api-scaled:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=ecommerce;Username=serilog;Password=serilog123
      - Serilog__WriteTo__LokiSink__Args__uri=http://loki:3100
      # INSTANCE_ID will fallback to hostname in Program.cs if not set
    volumes:
      - logs-data:/app/Logs
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - serilog-network
    expose:
      - "8080"
    profiles:
      - scaled

  #---------------------------------------------------------------------------
  # Load Balancer (scaled profile only)
  #---------------------------------------------------------------------------
  
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-scaled
    networks:
      - serilog-network
    profiles:
      - scaled

  #---------------------------------------------------------------------------
  # Load Testing (loadtest profile only)
  #---------------------------------------------------------------------------
  
  k6:
    image: grafana/k6:latest
    container_name: k6-loadtest
    volumes:
      - ./k6:/scripts
    environment:
      - K6_OUT=experimental-prometheus-rw
    command: run /scripts/load-test.js
    depends_on:
      - nginx
    networks:
      - serilog-network
    profiles:
      - loadtest

networks:
  serilog-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data:
  postgres-data:
  logs-data:
