apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        tags:
          - key: service.name
            value: service_name
          - key: service.namespace
            value: service_namespace
          - key: service.instance.id
            value: service_instance_id
          - key: deployment.environment
            value: deployment_environment
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$$__tags} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: Request rate (5m)
            query: "sum(rate(http_server_request_duration_seconds_count{$$__tags}[5m]))"
          - name: Request duration p95 (5m)
            query: "histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{$$__tags}[5m])) by (le))"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
    editable: false

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
