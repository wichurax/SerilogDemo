receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

  batch/logs:
    send_batch_size: 200
    send_batch_max_size: 200
    timeout: 1s

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 30s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 5m

  prometheus:
    endpoint: 0.0.0.0:9464

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [batch/logs]
      exporters: [otlp_http/loki]
