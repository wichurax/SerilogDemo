###############################################################################
# Nginx Load Balancer Configuration for SerilogDemo
#
# This configuration distributes traffic across multiple API instances
# using round-robin load balancing.
###############################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream info
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/rss+xml application/atom+xml image/svg+xml;

    #---------------------------------------------------------------------------
    # Upstream: API instances
    # Docker Compose DNS resolves 'api' to all container IPs
    #---------------------------------------------------------------------------
    upstream api_backend {
        # Round-robin is default
        # Use least_conn for least connections algorithm:
        # least_conn;
        
        # Docker internal DNS will resolve to all scaled instances
        server api:8080;
        
        # Keep connections alive for better performance
        keepalive 32;
    }

    upstream fulfillment_backend {
        server fulfillment-api:8080;
        keepalive 16;
    }

    upstream ui_backend {
        server ui:80;
        keepalive 16;
    }

    #---------------------------------------------------------------------------
    # Server: Load Balancer
    #---------------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for the load balancer itself
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # API-specific location with rate limiting (optional)
        location /api/ {
            proxy_pass http://api_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $http_x_user_id;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Fulfillment API route for browser-based warehouse tooling
        location /fulfillment-api/ {
            proxy_pass http://fulfillment_backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $http_x_user_id;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Keep Swagger available from the same ingress as the API.
        location /swagger {
            proxy_pass http://api_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $http_x_user_id;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /health {
            proxy_pass http://api_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $http_x_user_id;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Serve the UI through the shared ingress while keeping API routes above.
        location / {
            proxy_pass http://ui_backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}
